# EPRobot Pi 4 Wi-Fi client mode with static address.
network:
  version: 2
  renderer: networkd
  wifis:
    wlan0:
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.211.121.22/24
      routes:
        - to: default
          via: 10.211.121.1
      nameservers:
        addresses:
          - 114.114.114.114
          - 223.5.5.5
      access-points:
        "OnePlusAce5":
          password: "WIFI_PASSWORD_HERE"
